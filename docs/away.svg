<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
  <rect width="820" height="300" rx="12" fill="#1f1e1d"/>
  <text x="28" y="34" fill="#8b8a86">&gt; /route away</text>
  <text x="28" y="60" fill="#e9e7e2">200k tokens of context on Opus 5.5, cache warm for 42m more (60-minute TTL).</text>
  <g font-size="12">
    <text x="28" y="94"><tspan fill="#e9e7e2" font-weight="700">Note + /clear</tspan><tspan x="210" fill="#e9e7e2">now ≈ $0.06</tspan><tspan x="350" fill="#5fb36b">on return ≈ $0.00</tspan></text>
    <text x="46" y="110" fill="#8b8a86" font-size="11.5">Ask Claude to write the work in progress to a file, /rename, /clear; start the next session from the note.</text>
    <text x="28" y="136"><tspan fill="#e9e7e2" font-weight="700">/compact</tspan><tspan x="210" fill="#e9e7e2">now ≈ $0.12</tspan><tspan x="350" fill="#e9e7e2">on return ≈ $0.03</tspan></text>
    <text x="46" y="152" fill="#8b8a86" font-size="11.5">Say what to keep: /compact keep the plan, open TODOs and touched files. Only while the cache is warm.</text>
    <text x="28" y="178"><tspan fill="#e9e7e2" font-weight="700">/rename, /resume</tspan><tspan x="210" fill="#e9e7e2">now   $0.00</tspan><tspan x="350" fill="#e9e7e2">on return: summary</tspan></text>
    <text x="46" y="194" fill="#8b8a86" font-size="11.5">On Pro and Max, /resume of a big session offers to continue from a summary.</text>
    <text x="28" y="220"><tspan fill="#e9e7e2" font-weight="700">Keep warm</tspan><tspan x="210" fill="#e9e7e2">$0.04 an hour</tspan></text>
    <text x="46" y="236" fill="#8b8a86" font-size="11.5">An idle ping before each expiry (cache-tax does this); pays off for a few hours, not overnight.</text>
    <text x="28" y="262"><tspan fill="#e9e7e2" font-weight="700">Do nothing</tspan><tspan x="210" fill="#e9e7e2">now   $0.00</tspan><tspan x="350" fill="#e06c6c">on return   $1.60</tspan></text>
    <text x="46" y="278" fill="#8b8a86" font-size="11.5">The first send re-writes the whole context.</text>
  </g>
</svg>
